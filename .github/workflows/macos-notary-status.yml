name: Mac notarization status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-status:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: mac-distribution
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node.js 24
        with:
          persist-credentials: false
      - name: Check existing Apple submissions without uploading
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: node macos/distribution/check-submissions.mjs
