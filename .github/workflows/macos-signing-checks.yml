name: Check macOS signing tools
on:
  push:
    branches: [main, macos-port]
    paths:
      - 'macos/distribution/**'
      - '.github/workflows/macos-notarize.yml'
      - '.github/workflows/macos-notary-resume.yml'
      - '.github/workflows/macos-signing-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node.js 24
        with:
          persist-credentials: false
      - name: Validate Bash and embedded Python
        shell: bash
        run: |
          set -euo pipefail
          bash -n macos/distribution/sign-and-notarize.sh
          if [ -f macos/distribution/resume-notary.sh ]; then
            bash -n macos/distribution/resume-notary.sh
          fi
          node --check macos/distribution/notary-package.mjs
          node macos/distribution/test-notary-package.mjs
          python3 - <<'PY'
          import pathlib, re
          for name in ['sign-and-notarize.sh', 'resume-notary.sh']:
              script = pathlib.Path('macos/distribution', name).read_text()
              blocks = re.findall(r"<<'PY'\n(.*?)\nPY", script, flags=re.S)
              if not blocks:
                  raise SystemExit('No embedded Python blocks found: ' + name)
              for i, block in enumerate(blocks):
                  compile(block, f'{name}:python-{i + 1}', 'exec')
              print(f'{name}: Bash syntax and {len(blocks)} embedded Python blocks passed')
          PY
