name: Resume existing Mac notarization
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run ID that holds the encrypted pending artifact
        required: true
        type: string
      architecture:
        description: Pending package architecture
        required: true
        type: choice
        options: [arm64, x86_64]
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-notary-resume-${{ inputs.source_run_id }}-${{ inputs.architecture }}
  cancel-in-progress: false
jobs:
  resume:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository == 'ahmetcihatgokce/analiz-hukuk-toplu-udf-pdf-cevirici'
    environment: mac-distribution
    runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RUNNER_LABEL: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
      APPROVED_SOURCE_SHA: 98c996ec72181c0c2aa7704556faf21367386cd8
    steps:
      - name: Validate source run ID
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo 'Invalid source run ID' >&2; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node.js 24
        with:
          persist-credentials: false
      - name: Download the encrypted pending package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mac-notary-pending-${{ env.RUNNER_LABEL }}
          path: ${{ runner.temp }}/pending-input
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Resume the existing submission without uploading again
        id: notarization
        env:
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          bash macos/distribution/resume-notary.sh \
            "$RUNNER_TEMP/pending-input/envelope.json" "$RUNNER_TEMP/notarized-output"
      - name: Upload only the accepted, stapled distribution
        if: steps.notarization.outputs.state == 'accepted'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Toplu-UDF-PDF-Mac-1.04-notarized-${{ env.RUNNER_LABEL }}
          path: ${{ runner.temp }}/notarized-output
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary credentials and decrypted package
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for directory in "$RUNNER_TEMP"/mac-resume.*; do
            [[ -d "$directory" && ! -L "$directory" ]] || continue
            rm -rf -- "$directory"
          done
